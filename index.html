<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>ATHLETE OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--bg2:#0d0e10;--card:#131518;--card2:#1a1d21;--bd:#23272c;--tx:#eceef0;--mu:#8b929a;--dim:#5b626a;--ac:#39e07f;--acd:rgba(57,224,127,.12);--warn:#f2b84b;--bad:#ff5d5d;--font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em;font-weight:600}
h1{font-size:28px;line-height:1.15}h3{font-size:15px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{font-family:var(--disp);font-weight:700;letter-spacing:.2em;font-size:15px;padding:4px 10px 18px}
.logo b{color:var(--ac)}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;width:100%;text-align:left}
.nav a:hover,.nav button:hover{background:var(--card);color:var(--tx)}
.nav a.on{background:var(--card2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nav svg,.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:28px clamp(16px,3vw,40px) 70px;max-width:1280px;width:100%}
.mtop{display:none}
.tabbar{display:none}
.banner{background:#2a2410;border:1px solid #5a4a14;color:var(--warn);padding:10px 14px;border-radius:12px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.phead p{color:var(--mu);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.row.sp{justify-content:space-between}
.grid{display:grid;gap:16px}
.cols{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.cols4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;min-width:0}
.card.hl{border-color:#245a3a;background:linear-gradient(180deg,#112018,var(--card) 60%)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600}
.big{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.sm{font-size:12px}.ac{color:var(--ac)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3a4047}
.btn.primary{background:var(--ac);color:#04140a;border-color:var(--ac);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#4a2326}
.btn.sm{padding:6px 10px;font-size:12px}
.ib{width:28px;height:28px;border-radius:8px;color:var(--mu);display:inline-grid;place-items:center}
.ib:hover{background:var(--card2);color:var(--tx)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mu);border:1px solid var(--bd)}
.chip.ac{background:var(--acd);color:var(--ac);border-color:#245a3a}
.chip.warn{background:#2a2410;color:var(--warn);border-color:#5a4a14}
.chip.bad{background:#2a1214;color:var(--bad);border-color:#5a2326}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;border-bottom:1px solid var(--bd)}
.tabs button{padding:10px 14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.task:last-child{border:0}
.task .tt{flex:1;min-width:0}.task .tt b{font-weight:500;display:block}.task .tt span{color:var(--mu);font-size:12px}
.task.done .tt b{color:var(--mu);text-decoration:line-through}
.task .tm{font-variant-numeric:tabular-nums;color:var(--mu);width:46px;font-size:13px}
.task.now{background:linear-gradient(90deg,var(--acd),transparent);margin:0 -18px;padding-left:18px;padding-right:18px}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid #3a4047;display:grid;place-items:center;flex:none}
.chk svg{width:14px;height:14px;stroke:#04140a;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{background:var(--ac);border-color:var(--ac)}.chk.on svg{opacity:1}
.bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.bar.w i{background:var(--warn)}
.mac{margin:10px 0}.mac .ml{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px}.mac .ml span{color:var(--mu)}
.ring{position:relative;display:inline-block}.ring svg{width:100%;height:100%}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc b{font-family:var(--disp);font-size:22px}.ring .rc span{font-size:11px;color:var(--mu)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{text-align:center;padding:26px 14px;color:var(--mu)}
.empty .eico{font-size:26px;color:var(--dim)}.empty b{display:block;color:var(--tx);margin:4px 0}.empty p{font-size:13px}
.safety{border:1px solid #5a2326;background:#1c1012;border-radius:14px;padding:14px 16px;font-size:13px;color:#e8c9ca;margin-bottom:16px}
.safety b{color:var(--bad)}
.lock{border:1px dashed #5a4a14;background:#1d1a0d;border-radius:14px;padding:16px;color:var(--warn)}
.lock p{color:#cdbb80;margin:4px 0 12px;font-size:13px}
.list>div{padding:10px 0;border-bottom:1px solid var(--bd)}.list>div:last-child{border:0}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:500}.fld em{color:var(--ac);font-style:normal}
.fld small{display:block;color:var(--dim);font-size:11px;margin-top:4px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);flex:none;margin-top:2px}
input[type=range]{padding:0;accent-color:var(--ac)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.ck{display:flex;gap:10px;align-items:flex-start;margin:12px 0;color:var(--tx);font-size:13px;cursor:pointer}
.ferr,.merr{color:var(--bad);font-size:12px;min-height:0;margin-top:3px}
.merr{margin:6px 0 10px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.sheet.wide{width:min(760px,100%)}
.sheet h3{font-size:18px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--bd);padding:11px 18px;border-radius:12px;z-index:80;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.err{border-color:#5a2326;color:#ffb3b3}.toast[hidden]{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mu);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 6px;border-bottom:1px solid var(--bd)}.tbl td{padding:9px 6px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{padding:5px 12px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);font-size:12px}.chips button.on{background:var(--acd);color:var(--ac);border-color:#245a3a}
.day.today{border-color:#245a3a}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos figure{position:relative;border-radius:12px;overflow:hidden;background:var(--bg2);cursor:pointer}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:11px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cmpgrid figure img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
.cmpgrid figcaption{font-size:12px;color:var(--mu);margin-top:4px;text-align:center}
.cmp{position:relative;aspect-ratio:3/4;max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;--p:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .over{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp:after{content:"";position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--ac)}
.cmp input{position:absolute;left:0;right:0;bottom:8px;z-index:2;width:90%;margin:0 5%}
.pv{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-bottom:12px;background:#000}
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:24px 16px}
.onb[hidden]{display:none}
.onbwrap{width:min(560px,100%);margin:auto}
.dots{display:flex;gap:6px;margin:6px 0 22px}.dots i{height:4px;flex:1;border-radius:4px;background:var(--bd)}.dots i.on{background:var(--ac)}
.kpi{display:flex;flex-direction:column;gap:2px}
.stepn{font-size:12px;color:var(--mu)}
.tl{position:relative;height:10px;background:var(--card2);border-radius:99px;margin:26px 0 30px}
.tl i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:99px}
.tl s{position:absolute;top:-6px;width:2px;height:22px;background:#3a4047}.tl s span{position:absolute;top:24px;left:-16px;font-size:11px;color:var(--mu);text-decoration:none;width:34px;text-align:center}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}
 main{padding:14px 14px 100px}
 h1{font-size:24px}
 .mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:rgba(9,9,11,.92);backdrop-filter:blur(8px);z-index:20}
 .mtop .logo{padding:0}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(13,14,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--bd);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;color:var(--mu);text-decoration:none}
 .tabbar a.on{color:var(--ac)}.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
 .cols2{grid-template-columns:1fr}
 .modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;width:100%;max-height:94vh}
 .toast{bottom:84px}
}
@media(max-width:420px){.two{grid-template-columns:1fr}.big{font-size:26px}}
</style>
</head>

<div class="app">
  <aside class="side"><div class="logo">ATHLETE <b>OS</b></div><nav class="nav" id="sidenav"></nav></aside>

    <div class="mtop"><div class="logo">ATHLETE <b>OS</b></div><span class="chip ac" id="mday"></span></div>
    <main><div id="banner"></div><div id="view"></div></main>

</div>

<script>
'use strict';
/* ================= UTILITIES ================= */
const $=(s)=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sum=a=>a.reduce((x,y)=>x+y,0);
const byTime=(a,b)=>a.time.localeCompare(b.time);
const fmtDate=d=>parse(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const weekStart=d=>{const x=parse(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return ymd(x)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=v=>Math.abs(v)>=100?String(Math.round(v)):String(+v.toFixed(1));

/* ================= STATIC DATA ================= */
const LIB=[
['Dumbbell Bench Press','Chest'],['Incline Dumbbell Press','Chest'],['Machine Chest Press','Chest'],['Cable Fly','Chest'],['Push-Up','Chest'],
['Lat Pulldown','Back'],['Seated Cable Row','Back'],['One-Arm Dumbbell Row','Back'],['Assisted Pull-Up','Back'],['Straight-Arm Pulldown','Back'],
['Seated Dumbbell Shoulder Press','Shoulders'],['Dumbbell Lateral Raise','Shoulders'],['Face Pull','Shoulders'],['Rear Delt Fly','Shoulders'],['Machine Shoulder Press','Shoulders'],
['Dumbbell Curl','Biceps'],['Hammer Curl','Biceps'],['Cable Curl','Biceps'],
['Triceps Pushdown','Triceps'],['Overhead Triceps Extension','Triceps'],['Close-Grip Push-Up','Triceps'],
['Goblet Squat','Legs'],['Leg Press','Legs'],['Dumbbell Romanian Deadlift','Legs'],['Walking Lunge','Legs'],['Leg Curl','Legs'],['Leg Extension','Legs'],['Calf Raise','Legs'],
['Plank','Core'],['Cable Crunch','Core'],['Hanging Knee Raise','Core'],['Dead Bug','Core'],['Pallof Press','Core']
].map(a=>({name:a[0],muscle:a[1]}));
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Core'];
const FOODS=[
['Egg (large)',72,6.3,0.4,4.8],['Oats, dry (50 g)',190,6.5,33,3.5],['Whole milk (250 ml)',150,8,12,8],['Kefir (250 ml)',110,8,10,4],
['Greek yogurt (150 g)',130,15,6,4],['Cottage cheese (150 g)',147,17,5,6.5],['Cheese (30 g)',120,7,0.4,10],['Banana (medium)',105,1.3,27,0.4],
['Apple (medium)',95,0.5,25,0.3],['Orange (medium)',62,1.2,15,0.2],['Chicken breast, cooked (100 g)',165,31,0,3.6],['Beef, lean, cooked (100 g)',215,27,0,12],
['Salmon, cooked (100 g)',206,22,0,12],['Tuna, canned (100 g)',116,26,0,1],['White rice, cooked (150 g)',195,4,43,0.4],['Pasta, cooked (150 g)',235,8.7,46,1.4],
['Buckwheat, cooked (150 g)',138,5,27,1.1],['Potato, boiled (200 g)',174,4,40,0.2],['Flatbread / non (100 g)',270,9,52,2],['Whole-wheat bread (slice)',80,4,14,1],
['Lentils, cooked (150 g)',175,13.5,30,0.6],['Chickpeas, cooked (150 g)',246,13,41,4],['Plov (300 g plate)',600,20,70,28],['Peanut butter (2 tbsp)',190,7,7,16],
['Almonds (30 g)',175,6,6,15],['Walnuts (30 g)',196,4.6,4,19.6],['Olive oil (1 tbsp)',119,0,0,13.5],['Avocado (half)',160,2,9,15],
['Whey protein (1 scoop)',120,24,3,1.5],['Broccoli (100 g)',35,2.4,7,0.4],['Mixed salad (100 g)',20,1.5,3.5,0.2],['Tomato (100 g)',18,0.9,3.9,0.2],
['Cucumber (100 g)',15,0.7,3.6,0.1],['Honey (1 tbsp)',64,0,17,0]
].map((a,i)=>({id:'b'+i,name:a[0],kcal:a[1],p:a[2],c:a[3],f:a[4]}));
const MEALS=[['breakfast','Breakfast',.25],['lunch','Lunch',.30],['dinner','Dinner',.30],['snack','Snack',.15]];
const PHOTO_LABELS={face:['Front','Left','Right','Close-up'],hair:['Front hairline','Top','Crown','Sides'],body:['Front','Side','Back']};
const NAV=[['dashboard','Dashboard'],['routine','Daily Routine'],['training','Training Lab'],['nutrition','Nutrition'],['skin','Face & Skin'],['hair','Hair Lab'],['recovery','Recovery'],['metrics','Body Metrics'],['transformation','Transformation'],['analytics','Analytics'],['settings','Settings']];
const ICONS={
dashboard:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
routine:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
training:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
nutrition:'<path d="M12 7c-2-2-7-1-7 5 0 4 3 8 5 8 1 0 1-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-6-5-7-7-5z"/><path d="M12 7c0-2 1-4 3-4"/>',
skin:'<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 7 2 8 0M9 9h.01M15 9h.01"/>',
hair:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>',
recovery:'<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>',
metrics:'<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
transformation:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
analytics:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'};
const ico=n=>`<svg class="ico" viewBox="0 0 24 24">${ICONS[n]||''}</svg>`;

/* ================= STATE ================= */
const KEY='athleteos_v1',REAL_BAK='athleteos_real_backup';
function defRoutine(){

function readForm(form,fields){
  const vals={},errs={};
  for(const f of fields){const el=form.elements[f.name];vals[f.name]=f.type==='checkbox'?el.checked:(el.value||'').trim()}
  for(const f of fields){
    const raw=vals[f.name],req=typeof f.req==='function'?f.req(vals):f.req;
    if(f.type==='checkbox'){if(req&&!raw)errs[f.name]='This confirmation is required.';continue}
    if(raw===''){if(req)errs[f.name]='Required.';vals[f.name]=null;continue}
    if(f.type==='number'){
      const n=Number(raw);
      if(!isFinite(n)){errs[f.name]='Enter a valid number.';continue}
      if(f.min!=null&&n<f.min){errs[f.name]=`Minimum is ${f.min}.`;continue}
      if(f.max!=null&&n>f.max){errs[f.name]=`Maximum is ${f.max}.`;continue}
      if(f.int&&!Number.isInteger(n)){errs[f.name]='Enter a whole number.';continue}
      vals[f.name]=n;
    }else if(f.type==='date'){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)||isNaN(parse(raw))){errs[f.name]='Enter a valid date.'}
      else if(f.noFuture&&raw>today())errs[f.name]='Date cannot be in the future.';
    }else if(f.type==='time'){if(!/^\d{2}:\d{2}$/.test(raw))errs[f.name]='Enter a valid time.'}
    else if(f.type==='select'&&f.num)vals[f.name]=Number(raw);
    else if(f.max&&raw.length>f.max)errs[f.name]=`Max ${f.max} characters.`;
  }
  return{vals,errs};
}

function coach(){
  const t=today(),o={incomplete:[],flags:[],good:[],steps:[],adjust:null,week:''};
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const list=routineFor(t).slice().sort(byTime),dn=D(t).done;
  o.incomplete=list.filter(x=>!dn[x.id]);
  const overdue=o.incomplete.filter(x=>{const[h,m]=x.time.split(':').map(Number);return h*60+m<nowM-30});
  const ds=lastN(7).filter(d=>d>=S.start&&d<t);
  const comps=ds.map(completion).filter(x=>x!=null),a7=comps.length?Math.round(avg(comps)):null;
  const sl=lastN(7).map(d=>(D(d).rec||{}).sleep).filter(x=>x!=null),sAvg=sl.length?r1(avg(sl)):null;
  const nd=lastN(7).filter(d=>(D(d).meals||[]).length);
  const pAvg=nd.length?Math.round(avg(nd.map(d=>nut(d).p))):null;
  const ws=weekStart(t),sess=sessionsInWeek(ws),planned=S.schedule.filter(x=>x!=='rest').length;
  o.week=`Last 7 days: routine ${a7==null?'—':a7+'%'} · sleep ${sAvg==null?'—':sAvg+' h'} · protein ${pAvg==null?'—':pAvg+' g/day'} · sessions this week ${S.medical.cleared?sess+'/'+planned:'locked'}`;
  if(!S.medical.cleared)o.flags.push('Training is locked. Record clinician clearance to unlock workouts.');
  const sym=S.symptoms.filter(s=>s.date>=addDays(t,-7)&&(s.severity>=3||s.exercise));
  if(sym.length)o.flags.push('You logged concerning symptoms this week. Review them with your clinician before any training; the app will not raise intensity.');
  if(a7!=null&&a7<50)o.flags.push(`Routine consistency is low (${a7}% over 7 days).`);
  if(sAvg!=null&&sAvg<sleepTarget()-1)o.flags.push(`Average sleep is ${sAvg} h, below your ${sleepTarget()} h target.`);
  if(pAvg!=null&&pAvg<.9*S.targets.protein)o.flags.push(`Protein averages ${pAvg} g/day, under your ${S.targets.protein} g target.`);
  if(a7!=null&&a7>=80)o.good.push(`Strong routine consistency: ${a7}% over the last week.`);
  if(sAvg!=null&&sAvg>=sleepTarget()-.5)o.good.push(`Sleep is on target (${sAvg} h average).`);
  if(pAvg!=null&&pAvg>=.9*S.targets.protein)o.good.push(`Protein is on target (${pAvg} g/day).`);
  overdue.slice(0,2).forEach(x=>o.steps.push(`Complete "${x.title}" — it was due at ${x.time}.`));
  if(!overdue.length&&o.incomplete.length)o.steps.push(`Next up: ${o.incomplete[0].time} ${o.incomplete[0].title}.`);
  const n=nut(t);
  if(!(D(t).meals||[]).length)o.steps.push('Log your first meal so protein can be tracked today.');
  else if(n.p<S.targets.protein*.7&&nowM>17*60)o.steps.push(`Protein is ${Math.round(n.p)} g so far. Add a protein-rich meal or snack.`);
  if((D(t).water||0)<S.targets.water*.5&&nowM>14*60)o.steps.push('Water is under half of target. Drink a glass now.');
  if(!(D(t).rec&&D(t).rec.sleep!=null))o.steps.push('Log last night’s sleep in Recovery.');
  if(!S.metrics.some(m=>m.date>=addDays(t,-14)))o.steps.push('Log weight and measurements (none in 14 days).');
  o.steps=o.steps.slice(0,4);
  const h=S.goals.habit;
  if(comps.length>=5){
    if(a7<50&&h>60)o.adjust={v:Math.max(60,h-10),msg:`Consistency is ${a7}%. Set a more realistic habit target of ${Math.max(60,h-10)}% for next week and rebuild from there.`};
    else if(a7>=h+5&&h<95)o.adjust={v:Math.min(95,h+5),msg:`You beat your ${h}% habit target (${a7}%). Raise it to ${Math.min(95,h+5)}%?`};
  }
  return o;
}

function coachHtml(c){

}

/* workout logger */
let W=null;
function openLogger(tid){
  if(!S.medical.cleared)return toast('Training is locked until medical clearance is recorded.','err');
  const tp=S.templates.find(t=>t.id===tid);
  W={date:today(),name:tp?tp.name:'Custom session',exs:(tp?tp.ex:[]).map(x=>({name:x.name,target:`${x.sets}×${x.reps} · rest ${x.rest}s`,sets:Array.from({length:x.sets},()=>({reps:'',w:lastWeight(x.name)}))})),notes:'',ok:false};
  drawLogger();
}
function collectLogger(){const f=$('#wform');if(!f)return;W.date=f.elements.date.value;W.notes=f.elements.notes.value;W.ok=f.elements.ok.checked;f.querySelectorAll('[data-ex]').forEach(i=>{W.exs[+i.dataset.ex].sets[+i.dataset.set][i.dataset.f]=i.value})}
function drawLogger(){
  const st=$('#sheet').scrollTop;
  openModal(`<form id="wform" novalidate><h3>${esc(W.name)}</h3>${safetyBox()}
  <label class="ck"><input type="checkbox" name="ok" ${W.ok?'checked':''}><span>I feel well and have no concerning symptoms today. I will stay within my clinician-approved limits.</span></label>
  <div class="fld"><label>Date</label><input type="date" name="date" value="${W.date}" max="${today()}"></div>
  ${W.exs.map((x,ei)=>`<div class="card" style="margin-bottom:12px;background:var(--card2)"><div class="row sp"><b>${esc(x.name)}</b><button type="button" class="ib" data-act="wk-del-ex" data-ex="${ei}" aria-label="Remove exercise">✕</button></div>${x.target?`<div class="mu sm">${esc(x.target)}</div>`:''}
   <table class="tbl"><tr><th>Set</th><th>Reps</th><th>kg</th><th></th></tr>${x.sets.map((s,si)=>`<tr><td>${si+1}</td><td><input inputmode="numeric" data-ex="${ei}" data-set="${si}" data-f="reps" value="${esc(s.reps)}" aria-label="Reps"></td><td><input inputmode="decimal" data-ex="${ei}" data-set="${si}" data-f="w" value="${esc(s.w)}" aria-label="Weight kg"></td><td><button type="button" class="ib" data-act="wk-del-set" data-ex="${ei}" data-set="${si}">✕</button></td></tr>`).join('')}</table>
   <button type="button" class="btn sm" style="margin-top:8px" data-act="wk-add-set" data-ex="${ei}">+ Set</button></div>`).join('')}
  <div class="row" style="margin-bottom:12px"><select id="wAdd" style="flex:1">${exNames().map(n=>`<option>${esc(n)}</option>`).join('')}</select><button type="button" class="btn" data-act="wk-add-ex">+ Add exercise</button></div>
  <div class="fld"><label>Notes</label><textarea name="notes" rows="2" maxlength="300">${esc(W.notes)}</textarea></div><div class="merr" id="mErr"></div>
  <div class="row end"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn primary" data-act="wk-save">Save workout</button></div></form>`,true);
  $('#sheet').scrollTop=st;
}
function saveLogger(){
  collectLogger();const err=m=>{$('#mErr').textContent=m};
  if(!W.ok)return err('Please confirm you feel well before saving.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(W.date)||W.date>today())return err('Choose a valid date that is not in the future.');
  const exs=[];
  for(const x of W.exs){const sets=[];for(const s of x.sets){if(String(s.reps).trim()==='')continue;const r=Number(s.reps),w=String(s.w).trim()===''?0:Number(s.w);
    if(!Number.isInteger(r)||r<1||r>100)return err(`${x.name}: reps must be a whole number from 1 to 100.`);
    if(!isFinite(w)||w<0||w>500)return err(`${x.name}: weight must be 0–500 kg.`);sets.push({reps:r,w})}
    if(sets.length)exs.push({name:x.name,muscle:muscleOf(x.name),sets})}
  if(!exs.length)return err('Enter reps for at least one set.');
  S.workouts.push({id:uid(),date:W.date,name:W.name,exs,notes:W.notes.trim().slice(0,300)});
  W=null;closeModal();commit();toast('Workout saved');
}

    <div class="card"><div class="hd"><h3>Energy · fatigue · soreness</h3></div>${lineChart([{name:'Energy',color:'#39e07f',vals:ds.map(d=>R(d).energy??null)},{name:'Fatigue',color:'#ff5d5d',vals:ds.map(d=>R(d).fatigue??null)},{name:'Soreness',color:'#f2b84b',vals:ds.map(d=>R(d).sore??null)}],lb,{min:1,max:5})}</div>
    <div class="card"><div class="hd"><h3>Sleep quality</h3></div>${lineChart([{name:'Quality',color:'#39e07f',vals:ds.map(d=>R(d).sq??null)}],lb,{min:1,max:5,area:true})}</div>
    <div class="card"><div class="hd"><h3>Weekly recovery index (1–5)</h3></div>${lineChart([{name:'Index',color:'#39e07f',vals:idx}],lb,{min:1,max:5,area:true})}<p class="mu sm">Simple index from your own ratings. It is not a medical measure.</p></div></div>`;
  }

    const hr=S.hr.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.id<b.id?-1:1)),rh=hr.filter(h=>h.ctx==='resting').slice(-20);
    b=`${safetyBox()}<div class="grid cols2"><div class="card"><div class="hd"><h3>Heart-rate observations</h3><button class="btn sm primary" data-act="hr-add">+ Add</button></div><p class="mu sm" style="margin-bottom:10px">Your own readings only. They are never interpreted as medical clearance.</p>${hr.length?`<div class="list">${hr.slice().reverse().slice(0,15).map(h=>`<div class="row sp"><span><b>${h.bpm} bpm</b> · ${h.ctx} · ${fmtDate(h.date)}${S.medical.maxHR&&h.bpm>S.medical.maxHR?` <span class="chip bad">Above your clinician ceiling</span>`:''}<br><span class="mu sm">${esc(h.note||'')}</span></span><button class="ib" data-act="hr-del" data-id="${h.id}">✕</button></div>`).join('')}</div>`:empty('No readings','Add observations from your own device.')}
    ${rh.length>1?`<div style="margin-top:12px">${lineChart([{name:'Resting bpm',color:'#39e07f',vals:rh.map(h=>h.bpm)}],rh.map(h=>h.date.slice(5)),{unit:' bpm'})}</div>`:''}</div>
    <div class="card"><div class="hd"><h3>Symptom diary</h3><button class="btn sm primary" data-act="sym-add">+ Log symptom</button></div>${S.symptoms.length?`<div class="list">${S.symptoms.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="row sp"><span><b>${esc(s.type)}</b> · severity ${s.severity}/5 ${s.exercise?'<span class="chip bad">during exercise</span>':''}<br><span class="mu sm">${fmtDate(s.date)} ${esc(s.note||'')}</span></span><button class="ib" data-act="sym-del" data-id="${s.id}">✕</button></div>`).join('')}</div>`:empty('No symptoms logged','Record anything unusual so you can share it with your clinician.')}</div></div>`;
  }
  return pageHead('Recovery','Sleep, energy, soreness, heart-rate notes and symptoms.')+tabsHtml('recovery',[['overview','Overview'],['hrsym','HR & symptoms']])+b;
};

/* ---------- Metrics ---------- */

/* ---------- Transformation ---------- */
function review(N){
  const a=S.start,z=addDays(S.start,N-1),endD=z<today()?z:today(),inW=d=>d>=a&&d<=z;
  const ds=[];for(let d=a;d<=endD;d=addDays(d,1))ds.push(d);
  const m=sortedMetrics().filter(x=>inW(x.date)),mc=k=>{const v=m.filter(x=>x[k]!=null);return v.length>1?{a:v[0][k],z:v[v.length-1][k]}:null};
  const sk=S.skin.entries.filter(x=>inW(x.date)).sort((p,q)=>p.date.localeCompare(q.date)),hr=S.hair.entries.filter(x=>inW(x.date)).sort((p,q)=>p.date.localeCompare(q.date));
  const planned=ds.filter(d=>S.schedule[parse(d).getDay()]!=='rest').length,sess=S.workouts.filter(w=>inW(w.date)).length;
  const sl=ds.map(d=>(D(d).rec||{}).sleep).filter(x=>x!=null),sq=ds.map(d=>(D(d).rec||{}).sq).filter(x=>x!=null);
  const cm=ds.map(completion).filter(x=>x!=null);
  return{ds,weight:mc('weight'),meas:['waist','chest','shoulders','arms'].map(k=>[k,mc(k)]),planned,sess,nutDays:ds.filter(nutOK).length,
    skin:sk.length>1?{a:sk[0].acne,z:sk[sk.length-1].acne,ia:sk[0].irr,iz:sk[sk.length-1].irr}:null,hair:hr.length>1?{a:hr[0].shed,z:hr[hr.length-1].shed}:null,
    sleep:sl.length?r1(avg(sl)):null,sq:sq.length?r1(avg(sq)):null,routine:cm.length?Math.round(avg(cm)):null};
}
VIEWS.transformation=()=>{
  const idx=dayIndex();
  const card=N=>{
    const r=review(N),ms=S.milestones[N]||{},unlocked=idx>=N,st=ms.done?'Completed':unlocked?'Ready for review':idx<1?'Not started':`Interim · ${N-idx} day${N-idx>1?'s':''} to go`;
    const rows=[];
    rows.push(['Weight',r.weight?`${r.weight.a} → ${r.weight.z} kg (${r1(r.weight.z-r.weight.a)>0?'+':''}${r1(r.weight.z-r.weight.a)})`:'Needs 2+ entries']);
    r.meas.forEach(([k,v])=>rows.push([k[0].toUpperCase()+k.slice(1),v?`${v.a} → ${v.z} cm (${r1(v.z-v.a)>0?'+':''}${r1(v.z-v.a)})`:'Needs 2+ entries']));
    rows.push(['Workout consistency',S.workouts.length||S.medical.cleared?`${r.sess} of ${r.planned} planned sessions`:'Locked (no clearance)']);
    rows.push(['Nutrition consistency',`${r.nutDays} of ${r.ds.length} days on target`]);
    rows.push(['Routine adherence',r.routine==null?'—':r.routine+'% average']);
    rows.push(['Skin',r.skin?`Blemishes ${r.skin.a} → ${r.skin.z}; irritation ${r.skin.ia} → ${r.skin.iz}`:'Needs 2+ skin checks']);
    rows.push(['Hair',r.hair?`Observed shedding ${r.hair.a} → ${r.hair.z} (of 5)`:'Needs 2+ hair notes']);
    rows.push(['Sleep',r.sleep==null?'—':`${r.sleep} h average${r.sq!=null?' · quality '+r.sq+'/5':''}`]);
    return`<div class="card ${unlocked&&!ms.done?'hl':''}"><div class="hd"><div><div class="eyebrow">Day ${N}</div><h3>${N===30?'First review':N===60?'Progress review':'Final transformation review'}</h3></div><span class="chip ${ms.done?'ac':unlocked?'warn':''}">${st}</span></div>
    <table class="tbl">${rows.map(x=>`<tr><td class="mu">${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>${ms.note?`<p style="margin-top:10px" class="sm">“${esc(ms.note)}”</p>`:''}
    <div class="row" style="margin-top:12px"><button class="btn sm" data-act="ms-note" data-n="${N}">${ms.note?'Edit':'Add'} review note</button>${unlocked&&!ms.done?`<button class="btn sm primary" data-act="ms-done" data-n="${N}">Mark review complete</button>`:''}${ms.done?`<button class="btn sm ghost" data-act="ms-undo" data-n="${N}">Reopen</button>`:''}</div></div>`;
  };
  const cats=[['body','Body'],['face','Face'],['hair','Hair']];
  const pics=cats.map(([c,l])=>{const p=S.photos.filter(x=>x.cat===c).sort((a,b)=>a.date.localeCompare(b.date));return p.length>=2?`<div class="card"><div class="hd"><h3>${l}: before → latest</h3></div><div class="cmpgrid" style="margin:0"><figure><img src="${p[0].data}" alt="Before"><figcaption>${p[0].date}</figcaption></figure><figure><img src="${p[p.length-1].data}" alt="Latest"><figcaption>${p[p.length-1].date}</figcaption></figure></div></div>`:`<div class="card"><div class="hd"><h3>${l}: before → latest</h3></div>${empty('Need 2 photos','Upload in the matching section.')}</div>`}).join('');
  const pct=clamp(idx/90*100,0,100);
  return pageHead('90-Day Transformation','Three milestone reviews built only from your own recorded data.')+
  `<div class="card"><div class="hd"><h3>Timeline</h3><span class="chip ac">${idx<1?'Starts '+fmtDate(S.start):idx>90?'Completed':'Day '+idx+' of 90'}</span></div><div class="tl"><i style="width:${pct}%"></i><s style="left:33.3%"><span>D30</span></s><s style="left:66.6%"><span>D60</span></s><s style="left:calc(100% - 2px)"><span>D90</span></s></div></div>
  <div class="grid cols" style="margin-top:16px">${card(30)}${card(60)}${card(90)}</div><h3 style="margin:26px 0 12px">Before & after</h3><div class="grid cols">${pics}</div>`;
};

/* ---------- Analytics ---------- */
VIEWS.analytics=()=>{
  const n=ui.anRange,ds=rangeDates(n),t=today();
  const comp=ds.map(d=>({label:d.slice(8),v:completion(d),title:fmtDate(d)}));
  const wks=[];let w=weekStart(S.start);while(w<=t){wks.push(w);w=addDays(w,7)}
  const wl=wks.slice(-12),wadh=wl.map(ws=>{const c=[];for(let k=0;k<7;k++){const v=completion(addDays(ws,k));if(v!=null)c.push(v)}return{label:ws.slice(5),v:c.length?Math.round(avg(c)):null,title:'Week of '+ws}});

  return pageHead('Analytics','Everything here is calculated from data you recorded.',`<select style="width:auto" data-chg="anRange" aria-label="Range">${[14,30,90].map(x=>`<option value="${x}" ${x===n?'selected':''}>Last ${x} days</option>`).join('')}</select>`)+

  <div class="grid cols2" style="margin-top:16px">
  <div class="card"><div class="hd"><h3>Daily habit completion</h3></div>${barChart(comp,{max:100,target:S.goals.habit,unit:'%',empty:'No routine data in this range.'})}</div>
  <div class="card"><div class="hd"><h3>Weekly adherence</h3></div>${barChart(wadh,{max:100,unit:'%',empty:'No weekly data yet.'})}</div>
  <div class="card"><div class="hd"><h3>Training consistency (sessions / week)</h3></div>${barChart(train,{target:plan,empty:'No training data yet.'})}</div>
  <div class="card"><div class="hd"><h3>Nutrition adherence (protein % of target)</h3></div>${barChart(nutr,{target:100,unit:'%',max:150,empty:'Log meals to see adherence.'})}</div>
  <div class="card"><div class="hd"><h3>Sleep duration & quality</h3></div>${lineChart([{name:'Hours',color:'#39e07f',vals:ds.map(d=>R(d).sleep??null)}],lb,{unit:' h',target:sleepTarget(),empty:'Log sleep in Recovery.'})}${lineChart([{name:'Quality (1–5)',color:'#f2b84b',vals:ds.map(d=>R(d).sq??null)}],lb,{min:1,max:5,h:130,empty:''})}</div>
  <div class="card"><div class="hd"><h3>Body weight trend</h3></div>${lineChart([{name:'Weight',color:'#39e07f',vals:m.map(x=>x.weight??null)}],m.map(x=>x.date.slice(5)),{unit:' kg',area:true,empty:'Log weight in Body Metrics.'})}</div>
  <div class="card scroll"><div class="hd"><h3>Measurement changes</h3></div><table class="tbl"><tr><th>Metric</th><th>First</th><th>Latest</th><th>Change</th></tr>${chg}</table></div>
  <div class="card"><div class="hd"><h3>Appearance routine consistency</h3></div>${barChart(app,{max:100,unit:'%',empty:'Tick skin and hair tasks to see consistency.'})}</div></div>
  <div class="card" style="margin-top:16px"><div class="hd"><h3>90-day progress overview</h3></div><div class="row" style="gap:24px">${ring(clamp(idx/90*100,0,100),{size:110,text:clamp(idx,0,90)+'/90',label:'days'})}<div style="flex:1;min-width:220px"><div class="tl" style="margin:10px 0 28px"><i style="width:${clamp(idx/90*100,0,100)}%"></i><s style="left:33.3%"><span>D30</span></s><s style="left:66.6%"><span>D60</span></s><s style="left:calc(100% - 2px)"><span>D90</span></s></div><div class="mu sm">Days with any logged data: ${Object.keys(S.days).filter(d=>d>=S.start).length}</div></div></div></div>`;
};

/* ================= RENDER / ROUTING ================= */
let route='dashboard';
function getRoute(){const r=(location.hash||'').replace(/^#\/?/,'');return VIEWS[r]?r:'dashboard'}
function render(){
  route=getRoute();
  let h;try{h=VIEWS[route]()}catch(e){console.error(e);h=`<div class="card">${empty('Something went wrong',esc(e.message))}</div>`}
  $('#view').innerHTML=h;
  $('#banner').innerHTML=S.demo?`<div class="banner"><span><b>DEMO DATA</b> — sample numbers, not your real progress.</span><button class="btn sm" data-act="demo-off">Exit demo</button></div>`:'';
  const link=(r,l,cls='')=>`<a href="#/${r}" class="${r===route?'on':''}">${ico(r)}<span>${l}</span></a>`;
  $('#sidenav').innerHTML=NAV.map(n=>link(n[0],n[1])).join('');
  $('#tabbar').innerHTML=['dashboard','routine','training','nutrition'].map(r=>`<a href="#/${r}" class="${r===route?'on':''}">${ico(r)}<span>${NAV.find(n=>n[0]===r)[1].split(' ')[0]}</span></a>`).join('')+`<button data-act="more">${ico('more')}<span>More</span></button>`;
  const i=dayIndex();$('#mday').textContent=i<1?'Not started':i>90?'Done':'Day '+i+'/90';
  document.title='ATHLETE OS · '+NAV.find(n=>n[0]===route)[1];
}
function afterNav(){window.scrollTo(0,0)}
window.addEventListener&&window.addEventListener('hashchange',()=>{closeModal();render();afterNav()});

function procPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!file.type||!file.type.startsWith('image/'))return rej('Please choose an image file.');
    if(file.size>20e6)return rej('Image is larger than 20 MB.');
    const fr=new FileReader();fr.onerror=()=>rej('Could not read the file.');
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej('Could not decode the image.');im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}
function onPhotoFile(e){

    formModal({title:'Save photo',extra:`<img class="pv" src="${data}" alt="Preview">`,fields:[{name:'date',label:'Date',type:'date',req:true,noFuture:true,val:today()},{name:'label',label:'Angle',type:'select',opts:PHOTO_LABELS[cat].map(x=>[x,x])},{name:'note',label:'Note',type:'text',max:100}],

  }).catch(m=>toast(m,'err'));
}

function dl(name,mime,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=c=>`"${String(c??'').replace(/"/g,'""')}"`;
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');
function csvData(k){
  const ds=Object.keys(S.days).sort();
  if(k==='daily')return toCSV([['date','routine_completion_%','kcal','protein_g','carbs_g','fat_g','water_ml'],...ds.map(d=>{const n=nut(d);return[d,completion(d)??'',Math.round(n.kcal),Math.round(n.p),Math.round(n.c),Math.round(n.f),D(d).water||0]})]);
  if(k==='metrics')return toCSV([['date','weight_kg','waist_cm','chest_cm','shoulders_cm','arms_cm'],...sortedMetrics().map(m=>[m.date,m.weight,m.waist,m.chest,m.shoulders,m.arms])]);
  if(k==='workouts')return toCSV([['date','session','exercise','muscle','set','reps','weight_kg'],...S.workouts.flatMap(w=>w.exs.flatMap(x=>x.sets.map((s,i)=>[w.date,w.name,x.name,x.muscle,i+1,s.reps,s.w])))]);
  if(k==='meals')return toCSV([['date','meal','food','servings','kcal','protein','carbs','fat'],...ds.flatMap(d=>(D(d).meals||[]).map(m=>[d,m.type,m.name,m.qty,m.kcal,m.p,m.c,m.f]))]);
  if(k==='skin')return toCSV([['date','acne','oiliness','dryness','irritation','notes'],...S.skin.entries.map(e=>[e.date,e.acne,e.oil,e.dry,e.irr,e.notes])]);
  if(k==='hair')return toCSV([['date','condition','shedding_observed','notes'],...S.hair.entries.map(e=>[e.date,e.cond,e.shed,e.notes])]);
  if(k==='recovery')return toCSV([['date','sleep_h','sleep_quality','energy','fatigue','soreness','rest_day'],...ds.filter(d=>D(d).rec).map(d=>{const r=D(d).rec;return[d,r.sleep,r.sq,r.energy,r.fatigue,r.sore,r.restDay?1:0]})]);
  return'';
}

function onRestoreFile(e){
  const file=e.target.files[0];if(!file)return;
  const fr=new FileReader();fr.onerror=()=>toast('Could not read the file.','err');
  fr.onload=()=>{try{
    const o=JSON.parse(fr.result),data=o&&o.data?o.data:o;
    if(!data||typeof data!=='object'||!data.profile||!data.days||!Array.isArray(data.workouts))throw new Error('This does not look like an ATHLETE OS backup.');
    confirmBox('Replace ALL current data with this backup?',()=>{S=migrate(data);S.onboarded=true;save();render();toast('Backup restored')},'Restore');
  }catch(err){toast(err.message||'Invalid backup file.','err')}};
  fr.readAsText(file);
}

  openModal(`<form id="rform"><h3>Erase all data</h3><p class="mu" style="margin-bottom:12px">This permanently deletes everything stored in this browser, including photos. Export a backup first if you may need it. Type <b>RESET</b> to confirm.</p><input id="rtxt" autocomplete="off" aria-label="Type RESET"><div class="merr" id="mErr"></div><div class="row end" style="margin-top:12px"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn danger">Erase everything</button></div></form>`);
  $('#rform').onsubmit=e=>{e.preventDefault();if($('#rtxt').value.trim()!=='RESET'){$('#mErr').textContent='Type RESET exactly.';return}
    try{localStorage.removeItem(KEY);localStorage.removeItem(REAL_BAK)}catch(x){}S=defaults();closeModal();location.hash='#/dashboard';startOnboarding()};
};
/* demo */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildDemo(){
  const s=defaults(),R=rng(7);S=s;
  s.demo=true;s.onboarded=true;s.profile.name='Demo';s.start=addDays(today(),-27);
  s.medical={cleared:true,ack:true,clinician:'DEMO — not a real clinician',date:addDays(today(),-30),intensity:'light',maxHR:null,limits:'DEMO ONLY: example limits for illustration.',notes:''};
  s.hair.treatments=[{id:uid(),name:'Scalp massage (demo)',days:[1,3,5],note:'demo'},{id:uid(),name:'Gentle wash (demo)',days:[0,2,4,6],note:'demo'}];
  const by=n=>FOODS.find(f=>f.name===n);
  const sets={breakfast:[['Egg (large)',2],['Oats, dry (50 g)',1.5],['Whole milk (250 ml)',1],['Banana (medium)',1]],lunch:[['Chicken breast, cooked (100 g)',1.5],['White rice, cooked (150 g)',2],['Mixed salad (100 g)',1],['Olive oil (1 tbsp)',1]],dinner:[['Beef, lean, cooked (100 g)',1],['Potato, boiled (200 g)',1.5],['Broccoli (100 g)',1.5],['Flatbread / non (100 g)',.5]],snack:[['Greek yogurt (150 g)',1],['Almonds (30 g)',1]]};
  const base={Chest:14,Back:35,Shoulders:8,Biceps:10,Triceps:20,Legs:30,Core:0,Other:0};
  for(let i=0;i<=27;i++){
    const d=addDays(s.start,i),p=.5+i/27*.38,dd=DW(d);
    routineFor(d).forEach(t=>{if(R()<p)dd.done[t.id]=true});
    s.skin.items.forEach(it=>{if(R()<p)dd.done[it.id]=true});
    hairDue(d).forEach(it=>{if(R()<p)dd.done[it.id]=true});
    dd.water=Math.round((1800+R()*1500)/250)*250;
    if(R()<.9)MEALS.forEach(m=>{if(m[0]==='snack'&&R()<.4)return;sets[m[0]].forEach(([n,q])=>{const f=by(n);if(f)dd.meals.push(mealEntry(m[0],f,Math.max(.5,Math.round(q*(.85+R()*.3)*4)/4)))})});
    const rd=()=>Math.min(5,Math.max(1,Math.round(2.5+R()*2.5)));
    dd.rec={sleep:r1(6.3+R()*2),sq:rd(),energy:rd(),fatigue:Math.max(1,6-rd()),sore:Math.max(1,6-rd())};
    if(dayType(d)==='gym'){const tp=s.templates.find(t=>t.id===s.schedule[parse(d).getDay()]);
      if(tp&&R()<.9)s.workouts.push({id:uid(),date:d,name:tp.name,notes:'',exs:tp.ex.map(x=>{const mu=muscleOf(x.name);return{name:x.name,muscle:mu,sets:Array.from({length:x.sets},()=>({reps:8+Math.floor(R()*5),w:Math.round(base[mu]*(1+i*.012))}))}})})}
    if(i%7===0)s.metrics.push({id:uid(),date:d,weight:r1(65+i*.035+R()*.3),waist:r1(77-i*.01+R()*.4),chest:r1(94+i*.04+R()*.3),shoulders:r1(112+i*.035+R()*.3),arms:r1(31+i*.02+R()*.2)});
    if(i%3===0)s.skin.entries.push({id:uid(),date:d,acne:Math.max(0,Math.round(7-i*.15+R()*2)),oil:2+Math.floor(R()*3),dry:1+Math.floor(R()*3),irr:1+Math.floor(R()*2),notes:''});
    if(i%7===0)s.hair.entries.push({id:uid(),date:d,cond:3+Math.floor(R()*2),shed:2+Math.floor(R()*2),notes:''});
    if(i%10===0)s.posture.push({id:uid(),date:d,rating:3+(i>14?1:0),note:'Demo observation'});
  }
  return s;
}
ACT['demo-on']=()=>confirmBox('Load labeled demo data? Your real data is kept safe and restored when you exit demo.',()=>{
  try{if(!S.demo)localStorage.setItem(REAL_BAK,JSON.stringify(S))}catch(e){toast('Not enough storage for demo mode. Export a backup first.','err');return}
  S=buildDemo();save();location.hash='#/dashboard';render();toast('Demo data loaded');},'Load demo');
ACT['demo-off']=()=>{let back=null;try{const r=localStorage.getItem(REAL_BAK);if(r)back=migrate(JSON.parse(r))}catch(e){}
  S=back||defaults();if(!back)S.onboarded=false;try{localStorage.removeItem(REAL_BAK)}catch(e){}save();render();if(!S.onboarded)startOnboarding();else toast('Demo closed. Your data is back.')};
/* ================= CHANGE / INPUT HANDLERS ================= */
const CHG={
  sched:(v,el)=>{S.schedule[+el.dataset.wd]=v;commit()},
  cmp:(v,el)=>{ui.cmp[el.dataset.cat]=Object.assign(ui.cmp[el.dataset.cat]||{},{[el.dataset.side]:v});render()},
  progEx:v=>{ui.progEx=v;render()},
  anRange:v=>{ui.anRange=+v;render()}
};
const INP={exq:v=>{ui.exQuery=v;render()},foodq:v=>{ui.foodQ=v;render()}};
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('click',e=>{
    if(e.target.id==='modal'&&!$('#onb').contains(e.target)){if(!W)closeModal();return}
    const t=e.target.closest('[data-act]');if(!t)return;
    const a=ACT[t.dataset.act];if(a){if(t.tagName==='A'&&t.dataset.act==='close'){closeModal();return}a(t.dataset,t,e)}
  });
  document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t.value,t)});
  let inT;
  document.addEventListener('input',e=>{
    const sl=e.target.closest('[data-slide]');if(sl){sl.parentElement.style.setProperty('--p',sl.value+'%');return}
    const t=e.target.closest('[data-inp]');if(!t)return;const k=t.dataset.inp;clearTimeout(inT);
    inT=setTimeout(()=>{INP[k](t.value);const n=document.querySelector(`[data-inp="${k}"]`);if(n){n.focus();const l=n.value.length;n.setSelectionRange&&n.setSelectionRange(l,l)}},250);
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden){W=null;closeModal()}});
  $('#file').addEventListener('change',onPhotoFile);$('#restore').addEventListener('change',onRestoreFile);
}
/* ================= ONBOARDING ================= */
let O={step:0};
const oAck={name:'ack',type:'checkbox',req:true,label:'I understand ATHLETE OS cannot grant medical clearance. Workout plans stay locked until I record clearance from a qualified clinician.'};
function onbSteps(){return[
  {t:'Welcome to ATHLETE OS',intro:'Your personal 90-day appearance transformation and athlete lifestyle system. Everything stays on this device.',fields:[{name:'name',label:'Name (optional)',type:'text',max:40,val:S.profile.name},{name:'age',label:'Age',type:'number',min:14,max:90,int:true,req:true,val:S.profile.age},{name:'height',label:'Height (cm)',type:'number',min:120,max:230,req:true,val:S.profile.height},{name:'weight',label:'Current weight (kg)',type:'number',min:30,max:250,step:.1,req:true,val:S.profile.weight},{name:'wake',label:'Wake time',type:'time',req:true,val:S.profile.wake},{name:'bed',label:'Target bedtime',type:'time',req:true,val:S.profile.bed}],
   save:v=>Object.assign(S.profile,v)},
  {t:'Medical safety check',intro:'You reported PSVT. Before any workout plan is enabled, record clearance from a qualified clinician and any limits they set. You can continue without it, but training stays locked.',fields:[...medFields(S.medical),oAck],save:v=>{const{ack,...m}=v;Object.assign(S.medical,m,{ack:true})}},
  {t:'Nutrition targets',intro:'Initial editable estimates for gradual, healthy muscle gain. Protein reference: about 1.6–2.0 g per kg (≈105–130 g/day at 65 kg), subject to individual suitability. No aggressive deficits.',fields:tgtFields(S.targets),save:v=>Object.assign(S.targets,v)},
  {t:'Start your 90 days',intro:'Pick Day 1. You can change it later in Settings.',fields:[{name:'start',label:'Day 1',type:'date',req:true,val:S.start}],save:v=>{S.start=v.start},last:true}
]}
function startOnboarding(){O.step=0;onbDraw()}
function onbDraw(){
  const st=onbSteps(),s=st[O.step];
  $('#onb').hidden=false;
  $('#onb').innerHTML=`<div class="onbwrap"><div class="logo" style="padding-left:0">ATHLETE <b>OS</b></div><div class="dots">${st.map((_,i)=>`<i class="${i<=O.step?'on':''}"></i>`).join('')}</div><div class="stepn">Step ${O.step+1} of ${st.length}</div><h1 style="margin:4px 0 8px">${s.t}</h1><p class="mu" style="margin-bottom:18px">${s.intro}</p>${s.last?'<div class="safety" style="color:var(--tx);background:var(--card);border-color:var(--bd)"><b style="color:var(--tx)">Demo option:</b> prefer to look around first? You can load clearly labeled demo data and exit it any time.</div>':''}
  <form id="oform" novalidate>${s.fields.map(fieldHtml).join('')}<div class="merr" id="mErr"></div><div class="row sp">${O.step>0?'<button type="button" class="btn ghost" id="oBack">Back</button>':'<span></span>'}<span class="row">${s.last?'<button type="button" class="btn" id="oDemo">Try demo data</button>':''}<button class="btn primary">${s.last?'Start ATHLETE OS':'Continue'}</button></span></div></form></div>`;
  const form=$('#oform');
  form.onsubmit=e=>{e.preventDefault();const{vals,errs}=readForm(form,s.fields);showErrs(form,errs);if(Object.keys(errs).length)return;
    s.save(vals);
    if(s.last){S.onboarded=true;save();$('#onb').hidden=true;location.hash='#/dashboard';render()}else{O.step++;save();onbDraw();window.scrollTo&&window.scrollTo(0,0)}};
  const b=$('#oBack');if(b)b.onclick=()=>{O.step--;onbDraw()};
  const dm=$('#oDemo');if(dm)dm.onclick=()=>{const{vals,errs}=readForm(form,s.fields);S.start=vals.start||S.start;try{localStorage.setItem(REAL_BAK,JSON.stringify(Object.assign({},S,{onboarded:false})))}catch(e){}S=buildDemo();save();$('#onb').hidden=true;location.hash='#/dashboard';render()};
}
function boot(){if(!S.onboarded)startOnboarding();render()}
if(typeof document!=='undefined'&&!(typeof window!=='undefined'&&window.__TEST__))boot();
</script>
